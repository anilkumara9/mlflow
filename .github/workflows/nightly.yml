name: Nightly

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview nightly issues without publishing or changing state"
        required: false
        type: boolean
        default: true

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  analyze:
    if: >-
      github.repository == 'mlflow/mlflow' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      bundle_artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
          resolution-strategy: lowest
          enable-cache: false
      - name: Configure Python tooling
        run: |
          python_version=$(cat .python-version)
          downloads=$(uv python list "$python_version" --all-versions --only-downloads)
          if [[ -z "$downloads" ]]; then
            echo "::error::$(uv --version) cannot download Python $python_version for this platform. Update required-version in pyproject.toml."
            exit 1
          fi
          echo "$downloads"
          {
            echo 'UV_INDEX_STRATEGY=unsafe-first-match'
            echo 'UV_NO_PROGRESS=1'
            echo 'UV_EXCLUDE_NEWER=P7D'
            echo 'HF_HUB_DISABLE_PROGRESS_BARS=1'
          } >> "$GITHUB_ENV"
      - name: Collect scheduled failures and issue history
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --directory .claude/skills --package skills skills nightly collect --out-dir /tmp/nightly-context
          has_failures=$(jq -r '[.runs[].jobs[]] | length > 0' /tmp/nightly-context/snapshot.json)
          echo "has_failures=$has_failures" >> "$GITHUB_OUTPUT"
      - name: Preserve original inputs outside the agent's writable paths
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-bundle/context"
          cp /tmp/nightly-context/snapshot.json "$RUNNER_TEMP/nightly-bundle/context/"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.collect.outputs.has_failures == 'true'
        with:
          node-version: "24"
      - name: Install npm
        if: steps.collect.outputs.has_failures == 'true'
        run: npm install -g npm@12.0.1
      - name: Install sandbox dependencies
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Claude Code
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          .claude/scripts/install-claude.sh
          claude --version
      - name: Install sandbox runtime
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          export npm_config_before="$(date -u -d '7 days ago' +%Y-%m-%d)"
          npm install -g @anthropic-ai/sandbox-runtime@0.0.80
      - name: Prepare analysis dependencies and source revisions
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          uv sync --package skills
          jq -r '.runs[].head_sha' /tmp/nightly-context/snapshot.json | sort -u > "$RUNNER_TEMP/nightly-source-shas.txt"
          while IFS= read -r source_sha; do
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if ! git cat-file -e "$source_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$source_sha"
            fi
          done < "$RUNNER_TEMP/nightly-source-shas.txt"
      - name: Set up AI Gateway
        id: gateway
        if: steps.collect.outputs.has_failures == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TASK: nightly
        run: |
          RESPONSE=$(curl -sS --max-time 15 \
            -u "$DATABRICKS_CLIENT_ID:$DATABRICKS_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=ai-gateway \
            "$DATABRICKS_HOST/oidc/v1/token")
          TOKEN=$(jq -r '.access_token // empty' <<< "$RESPONSE")
          if [ -z "$TOKEN" ]; then
            echo "::error::Gateway token exchange failed: $(jq -r '.error_description // .error // "no access_token"' <<< "$RESPONSE")"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "base-url=${DATABRICKS_HOST%/}/ai-gateway" >> "$GITHUB_OUTPUT"
          TAGS=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg task "$TASK" '{$repository, $task}')
          echo "custom-headers=Databricks-Ai-Gateway-Request-Tags: $TAGS" >> "$GITHUB_OUTPUT"
      - name: Prepare sandbox paths
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/nightly-bundle/report" /tmp/nightly-out ~/.claude ~/.cache/uv ~/.npm
          if [ ! -f "$RUNNER_TEMP/nightly-bundle/context/snapshot.json" ]; then
            echo 'Nightly collector snapshot was not staged before analysis' >&2
            exit 1
          fi
          echo '{}' > ~/.claude.json
      - name: Start gateway proxy
        id: gateway-proxy
        if: steps.collect.outputs.has_failures == 'true'
        env:
          GATEWAY_TOKEN: ${{ steps.gateway.outputs.token }}
          GATEWAY_URL: ${{ steps.gateway.outputs.base-url }}
        run: |
          umask 077
          proxy_token=$(openssl rand -hex 32)
          echo "::add-mask::$proxy_token"
          printf 'token=%s\n' "$proxy_token" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$GATEWAY_TOKEN" "$proxy_token" | env -u GATEWAY_TOKEN -u GH_TOKEN \
            GATEWAY_URL="$GATEWAY_URL" node .claude/sandbox/gateway-proxy.mjs \
            > "$RUNNER_TEMP/nightly-gateway-proxy.log" 2>&1 &
          proxy_pid=$!
          printf '%s\n' "$proxy_pid" > "$RUNNER_TEMP/nightly-gateway-proxy.pid"
          unset GATEWAY_TOKEN proxy_token
          for _ in $(seq 1 30); do
            kill -0 "$proxy_pid" 2>/dev/null || break
            if curl --noproxy '*' -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --noproxy '*' -fsS http://127.0.0.1:8080/healthz > /dev/null
      - name: Configure sandbox log access
        if: steps.collect.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # analyze-ci follows GitHub's signed log-storage redirects.
          gh api meta > "$RUNNER_TEMP/nightly-github-meta.json"
          jq --exit-status --arg trusted_bundle "$RUNNER_TEMP/nightly-bundle" \
            --slurpfile meta "$RUNNER_TEMP/nightly-github-meta.json" '
            ($meta[0].domains.actions
              | if type == "array" then . else error("Invalid Actions domains in GitHub /meta") end
              | map(select(test("^productionresultssa[0-9]+\\.blob\\.core\\.windows\\.net$")))
              | unique) as $domains
            | if ($domains | length) == 0 then
                error("GitHub /meta returned no Actions log-storage domains")
              else
                .network.allowedDomains += ($domains | map(. + ":443"))
              end
            | .filesystem.denyWrite += [$trusted_bundle]
          ' .claude/sandbox/srt.json > "$RUNNER_TEMP/nightly-srt.json"
      - name: Check sandbox restrictions
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          srt --settings "$RUNNER_TEMP/nightly-srt.json" -- true
          host_processes=$(ps -e -o comm=)
          if ! grep -Fxq 'Runner.Worker' <<< "$host_processes"; then
            echo 'Runner.Worker was not found on the host' >&2
            exit 1
          fi
          srt --settings "$RUNNER_TEMP/nightly-srt.json" -- bash -c '
            set -euo pipefail
            processes=$(ps -e -o comm=)
            if grep -Fxq "Runner.Worker" <<< "$processes"; then
              echo "Runner.Worker is visible inside the sandbox" >&2
              exit 1
            fi
          '
          proxy_pid=$(cat "$RUNNER_TEMP/nightly-gateway-proxy.pid")
          if ! kill -0 "$proxy_pid" 2>/dev/null; then
            echo 'Gateway proxy is not running' >&2
            exit 1
          fi
          if [ ! -r "/proc/$proxy_pid/environ" ]; then
            echo 'Gateway proxy environment is unreadable' >&2
            exit 1
          fi
          if grep -azq '^GATEWAY_TOKEN=' "/proc/$proxy_pid/environ"; then
            echo 'Gateway proxy inherited GATEWAY_TOKEN' >&2
            exit 1
          elif [ "$?" -ne 1 ]; then
            echo 'Could not check gateway proxy environment' >&2
            exit 1
          fi
          for command in \
            'curl -sf https://example.com' \
            'curl -sf --unix-socket /var/run/docker.sock http://localhost/version' \
            'curl -sf --unix-socket /run/docker.sock http://localhost/version' \
            'ls /home/runner/work/_temp/_runner_file_commands | grep -q .'; do
            if srt --settings "$RUNNER_TEMP/nightly-srt.json" -- bash -c "$command"; then
              echo 'Sandbox allowed a forbidden operation' >&2
              exit 1
            fi
          done
          probe="$RUNNER_TEMP/nightly-bundle/.sandbox-write-probe"
          touch "$probe"
          rm "$probe"
          if srt --settings "$RUNNER_TEMP/nightly-srt.json" -- touch "$probe" || [ -e "$probe" ]; then
            rm -f "$probe"
            echo 'Sandbox allowed writes to the trusted Nightly bundle' >&2
            exit 1
          fi
      - name: Analyze failures in isolated worktrees
        if: steps.collect.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: http://localhost:8080/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ steps.gateway-proxy.outputs.token }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.gateway.outputs.custom-headers }}
          # The auto permission classifier requires this alias; investigators inherit the main model.
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          CLAUDE_CODE_FORK_SUBAGENT: "0"
          CLAUDE_CODE_ENABLE_TELEMETRY: "0"
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "0"
          OTEL_TRACES_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          XDG_DATA_HOME: /tmp/nightly-xdg-data
          XDG_CONFIG_HOME: /tmp/nightly-xdg-config
          XDG_CACHE_HOME: /tmp/nightly-xdg-cache
        run: |
          umask 077
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          timeout --kill-after=10s 30m srt --settings "$RUNNER_TEMP/nightly-srt.json" -- \
            env -u NO_PROXY -u no_proxy -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH \
              -u GITHUB_STATE -u GITHUB_STEP_SUMMARY claude \
              --model databricks-claude-sonnet-5-5 \
              --effort medium \
              --permission-mode auto \
              --disallowed-tools WebSearch \
              --settings '{"worktree":{"baseRef":"head"}}' \
              --print --verbose --output-format stream-json \
              "/nightly /tmp/nightly-context/snapshot.json /tmp/nightly-out" \
            | .claude/scripts/stream.sh "$RUNNER_TEMP/nightly-bundle/report/stream.jsonl"
      - name: Check coordinator worktree
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || \
            [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'Nightly analysis changed the coordinator checkout' >&2
            exit 1
          fi
      - name: Stage analysis report
        if: steps.collect.outputs.has_failures == 'true'
        run: |
          umask 077
          python - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          stage = Path(os.environ["RUNNER_TEMP"]) / "nightly-bundle" / "report"
          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK
          directory_fd = os.open("/tmp/nightly-out", flags | os.O_DIRECTORY)
          try:
              report_fd = os.open("report.json", flags, dir_fd=directory_fd)
              with os.fdopen(report_fd, "rb") as source:
                  metadata = os.fstat(source.fileno())
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 2 * 1024 * 1024:
                      raise ValueError("Nightly report must be a regular file no larger than 2 MiB")
                  with (stage / "report.json").open("xb") as target:
                      shutil.copyfileobj(source, target)
          finally:
              os.close(directory_fd)
          PY
      - name: Prepare an empty report when no failed jobs need analysis
        if: steps.collect.outputs.has_failures != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-bundle/report"
          echo '{"groups": []}' > "$RUNNER_TEMP/nightly-bundle/report/report.json"
      - name: Stop gateway proxy
        if: always() && steps.collect.outputs.has_failures == 'true'
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          if [ -f "$RUNNER_TEMP/nightly-gateway-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/nightly-gateway-proxy.pid")" 2>/dev/null || true
          fi
          if [ -s "$RUNNER_TEMP/nightly-gateway-proxy.log" ]; then
            cat "$RUNNER_TEMP/nightly-gateway-proxy.log"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: always()
        with:
          name: nightly-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-bundle
          if-no-files-found: error
          retention-days: 7

  execute:
    needs: analyze
    if: >-
      always() && github.repository == 'mlflow/mlflow' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run)) &&
      needs.analyze.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
          resolution-strategy: lowest
          enable-cache: false
      - name: Configure Python tooling
        run: |
          python_version=$(cat .python-version)
          downloads=$(uv python list "$python_version" --all-versions --only-downloads)
          if [[ -z "$downloads" ]]; then
            echo "::error::$(uv --version) cannot download Python $python_version for this platform. Update required-version in pyproject.toml."
            exit 1
          fi
          echo "$downloads"
          {
            echo 'UV_INDEX_STRATEGY=unsafe-first-match'
            echo 'UV_NO_PROGRESS=1'
            echo 'UV_EXCLUDE_NEWER=P7D'
            echo 'HF_HUB_DISABLE_PROGRESS_BARS=1'
          } >> "$GITHUB_ENV"
      # The bundle contains the host-preserved original inputs and the agent's report.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.analyze.outputs.bundle_artifact }}
          path: /tmp/nightly-bundle
          merge-multiple: true
      - name: Build execution plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          args=()
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          timeout 7m uv run --directory .claude/skills --package skills skills nightly post-check \
            --snapshot /tmp/nightly-bundle/context/snapshot.json \
            --report /tmp/nightly-bundle/report/report.json \
            --plan /tmp/nightly-plan.json "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/nightly-plan.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Check for durable live state
        id: state
        if: always() && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          if [ -f /tmp/nightly-bundle/context/snapshot.json ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.state.outputs.exists == 'true'
        with:
          name: nightly-state
          path: /tmp/nightly-bundle/context/snapshot.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
