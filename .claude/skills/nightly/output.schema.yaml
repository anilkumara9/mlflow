$schema: https://json-schema.org/draft/2020-12/schema
title: Nightly Failure Analysis
type: object
required: [groups]
properties:
  groups:
    type: array
    description: Causes covering every input failed job; jobs may appear in several causes.
    items:
      $ref: "#/$defs/group"
$defs:
  job:
    type: object
    required: [workflow, job, url]
    properties:
      workflow:
        type: string
        minLength: 1
      job:
        type: string
        minLength: 1
      url:
        type: string
  group:
    type: object
    required: [verdict, summary, jobs, evidence, uncertainties]
    properties:
      verdict:
        enum: [new, already_reported, transient, uncertain]
      summary:
        type: string
        minLength: 1
      jobs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/job"
      evidence:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      uncertainties:
        type: array
        items:
          type: string
          minLength: 1
      title:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[^\r\n]+$'
      issue_number:
        type: integer
        minimum: 1
    allOf:
      - if:
          properties:
            verdict:
              const: new
        then:
          required: [title]
      - if:
          properties:
            verdict:
              const: already_reported
        then:
          required: [issue_number]
