$schema: https://json-schema.org/draft/2020-12/schema
title: Nightly Failure Analysis
type: object
additionalProperties: false
required: [groups]
properties:
  groups:
    type: array
    description: Causes covering every input failed job; jobs may appear in several causes.
    items:
      $ref: "#/$defs/group"
$defs:
  job:
    type: object
    additionalProperties: false
    required: [workflow_name, name, url]
    properties:
      workflow_name:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      url:
        type: string
        pattern: '^https://github\.com/mlflow/mlflow/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*/job/[1-9][0-9]*$'
  group:
    type: object
    additionalProperties: false
    required: [verdict, summary, jobs, evidence, uncertainties]
    properties:
      verdict:
        enum: [new, already_reported, transient, uncertain]
      summary:
        type: string
        minLength: 1
      jobs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/job"
      evidence:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      uncertainties:
        type: array
        items:
          type: string
          minLength: 1
      title:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[^\r\n]+$'
      body:
        type: string
        minLength: 1
        maxLength: 60000
      issue_number:
        type: integer
        minimum: 1
    allOf:
      - if:
          properties:
            verdict:
              const: new
        then:
          required: [title, body]
        else:
          not:
            anyOf:
              - required: [title]
              - required: [body]
      - if:
          properties:
            verdict:
              const: already_reported
        then:
          required: [issue_number]
        else:
          not:
            required: [issue_number]
